# Data run (#369, D-478): reload named datasets and publish them from GitHub, not Robbie's machine.
# Also loads a map layer from files (`features`) or re-publishes values with no reload (`export-values`), #449.
# Manual only (Actions tab, "Data run", "Run workflow"). Why it can't drop live data: D-478 and
# docs/runbook.md section 8. Keys come from the "data" environment, which only the main branch can
# use, so a pushed branch or a fork PR never sees them.
name: Data run

on:
  workflow_dispatch:
    inputs:
      steps:
        # The allowed steps and which datasets each loads: data/ingest/src/check-run.ts.
        description: "Ingest steps, run in order, space-separated: acs acs-bg lodes places climdiv nbi fars airquality overdose cejst tri lead food-access nri svi timeline; or alone: features (map layers from files), export-values (re-publish values, no reload)"
        required: true
        default: acs
      datasets:
        description: "Dataset ids, space-separated; every step must load every one. Empty with export-values: every map"
        required: false
      allow_tract_drop:
        # D-506: only for a real loss (a new tract vintage, a county a source no longer covers).
        description: "Allow the upload to drop live tracts or counties (ALLOW_TRACT_DROP=1)"
        type: boolean
        default: false

# One data run at a time; a second one waits instead of racing the first one's uploads.
concurrency:
  group: data-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04 # D-552: features relies on its apt tippecanoe (2.49)
    timeout-minutes: 180 # #373: the Library pilot's ~142k value files took ~60 min to upload
    environment: data
    env:
      STEPS: ${{ inputs.steps }}
      DATASETS: ${{ inputs.datasets }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Inputs reach the shell only as env values, never pasted into a script; this rejects any step
      # or id outside the registry before $STEPS and $DATASETS are used unquoted below.
      - name: Check the steps and dataset ids
        run: node data/ingest/src/check-run.ts

      # The database password is part of SUPABASE_DB_URL; mask it alone too, in case an error prints it.
      - name: Mask the database password
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pw=$(node -e 'const u = new URL(process.env.SUPABASE_DB_URL); console.log(u.password); console.log(decodeURIComponent(u.password))')
          while read -r p; do [ -n "$p" ] && echo "::add-mask::$p"; done <<< "$pw"

      # A map layer from files (#449; check-run lets `features` run only alone): build its PMTiles and
      # upload only those. Its layers.json entry ships in git with its registry PR; if this load writes
      # a different one, stop before uploading so the tiles and the manifest can't drift apart.
      - name: Install GDAL and tippecanoe
        if: inputs.steps == 'features'
        run: sudo apt-get update -q && sudo apt-get install -y -q gdal-bin tippecanoe

      - name: Load the map layer
        if: inputs.steps == 'features'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          npm run ingest -- features $DATASETS
          git diff --exit-code apps/web/src/generated/layers.json || { echo "::error::layers.json from this load differs from main's; commit the regenerated entry in a PR, then run again"; exit 1; }

      - name: Publish the map layer's tiles
        if: inputs.steps == 'features'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: npm run ingest -- publish-tiles $DATASETS

      # `export-values` alone loads nothing (#449): it re-exports the database's state and county
      # values, every registry map when no ids are named, and publishes them like a load.
      - name: Load and export
        if: inputs.steps != 'features'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          for s in $STEPS; do [ "$s" = export-values ] || npm run ingest -- "$s" $DATASETS; done
          npm run ingest -- export-values $DATASETS
          npm run ingest -- details

      # Reads R2 only when this run didn't write the residents counts (a non-population load, #453).
      - name: Similar counties
        if: inputs.steps != 'features'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: npm run ingest -- similar

      # publish-reload merges this run's count files into the live ones on R2, then checks every
      # changed file (count shards, each map's tract files, state and county files) and stops before
      # the first upload if any would lose data. ALLOW_TRACT_DROP is set only when the run's input
      # asks for it. Click details go last, only once the values are up.
      - name: Publish to R2
        if: inputs.steps != 'features'
        env:
          ALLOW_TRACT_DROP: ${{ inputs.allow_tract_drop && '1' || '' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          npm run ingest -- publish-reload
          npm run ingest -- publish-details
          npm run ingest -- publish-similar

      # #368: keep the source downloads. Runs even if an earlier step failed (the downloads are still
      # worth keeping) and never fails the run itself: continue-on-error, and the script only warns.
      - name: Save raw downloads to R2
        if: always()
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: npm run ingest -- publish-raw

      - name: Summary
        if: always()
        run: |
          echo "Data run: steps \`$STEPS\`, datasets \`$DATASETS\`." >> "$GITHUB_STEP_SUMMARY"
