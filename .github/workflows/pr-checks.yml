name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  branch-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Branch includes the latest main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::This branch is behind main. Merge main into it and push again."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Decision numbers are unique and match this PR
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/check-decisions.mjs
