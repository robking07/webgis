summary:
  - "Cigarette smoking is the leading preventable cause of disease, death and disability in the United States.[1]"
  - "Nationally, smoking and secondhand smoke cause more than 480,000 deaths a year, nearly one in five deaths.[1]"
points:
  - "Lung cancer: in the United States, smoking is linked to about 80 percent of lung cancer deaths.[2]"
  - "People who smoke are 15 to 30 times more likely to get lung cancer or die from it than people who don't.[2]"
  - "Other diseases: smoking also causes other cancers, heart disease and stroke, lung diseases such as COPD, and type 2 diabetes.[1]"
