coverageNote: "Counted where people live, not where they work. Personal income is everything residents receive before taxes: wages and salaries, business and farm income, interest, dividends and rent, and government payments such as Social Security, Medicare and unemployment benefits, plus employers' pension and insurance contributions. That is broader than the Census's household income, which asks households about their cash income in a survey; BEA builds this from tax, payroll and program records, so it is higher, especially where retirees or investors live. It is spread over every resident, children included, so it is not what a typical person earns, and a few residents with very high incomes can lift a small county (Teton County, Wyoming). BEA reports some Virginia counties together with their independent cities, and Maui with Kalawao; each place in a group shows the group's figure. BEA publishes no figures for some places in some years (several Alaska areas, Connecticut's old counties in 2024); those show no data, not zero. Every year is in 2024 dollars, adjusted for inflation with the consumer price index (CPI-U), so earlier years are restated; the slider starts in 1990, although BEA has data back to 1969. BEA revises recent years each year. Connecticut shows its old counties through 2023 and its nine planning regions from 2024."
