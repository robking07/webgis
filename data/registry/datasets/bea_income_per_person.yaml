id: bea_income_per_person
title: Personal income per person
phrase: personal income per person
description: All the income of the people living in the area in a year, divided by the number of residents, in 2024 dollars. It counts wages, business and farm income, investment income and rent, and government payments such as Social Security and Medicare, before taxes.
category: Economy
subcategory: Income and poverty
