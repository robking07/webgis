updateCadence: annual
vintage: "2025 permits"
geographyLevels: [state, county]
unit: percent
universe: housing units authorized by building permits
coverageNote: "Permits are not completions: some permitted homes are built years later or never. Only places that issue building permits are counted, so a county with no permit-issuing places, or one that permitted no homes that year, shows no data; a county where some areas need no permit leaves those homes out. Small counties swing a lot from year to year: a single apartment building can take the share from 0% to over half. Connecticut shows its old counties through 2022 (with no data for 2020–2022) and its nine planning regions from 2023."
