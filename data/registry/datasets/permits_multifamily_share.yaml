id: permits_multifamily_share
title: New homes permitted in apartment buildings
phrase: shares of new homes in apartment buildings
description: Of the housing units authorized by building permits during the year, the share in buildings with 5 or more homes (apartments and condos). The rest are houses, duplexes and buildings with 3 or 4 homes.
category: Housing
subcategory: Homes
tags: [building permits, multifamily, apartments, new construction, housing supply, density]
source:
