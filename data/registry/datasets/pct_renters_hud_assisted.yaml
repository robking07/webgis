coverageNote: "A blank place is not a zero: HUD hides places with fewer than 11 reporting households, leaves out places where under half of households reported, and has no row for places without HUD-assisted homes. Only HUD's own programs count; homes funded only by tax credits (LIHTC) or USDA rural rental aid are not included. Renter households come from the 2020–2024 survey, so a few tracts with newer subsidized buildings top 100%."
