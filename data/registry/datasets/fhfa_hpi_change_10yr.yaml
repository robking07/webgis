id: fhfa_hpi_change_10yr
title: Home price change over 10 years
phrase: home price growth over 10 years
description: How much typical home prices rose or fell over the 10 years ending in the year shown, from a price index that follows the same homes as they resell. Teal areas gained; brown areas lost. The middle shade is little change, within 10%.
category: Housing
subcategory: Costs
tags: [home prices, house prices, appreciation, housing market, real estate, FHFA]
source:
  name: Federal Housing Finance Agency, House Price Index
  shortName: FHFA
  url: https://www.fhfa.gov/data/hpi/datasets
  citation: "Federal Housing Finance Agency, annual House Price Index (all-transactions, developmental state and county indexes), released March 31, 2026"
license: Public domain (U.S. Government work, 17 U.S.C. § 105)
updateCadence: annual
vintage: "2015–2025"
geographyLevels: [state, county]
unit: percent
universe: homes with mortgages bought or guaranteed by Fannie Mae or Freddie Mac
coverageNote: "Built from repeat sales and appraisals of homes with mortgages bought or guaranteed by Fannie Mae and Freddie Mac, so it leaves out cash sales, jumbo loans and most government-insured loans, and covers a place's typical home, not every one. FHFA calls the county figures developmental: they can be revised as new data arrive. Counties with too few sales have no index and show no data: about 1,400 counties have one in 1996, 2,000 by 2005 and about 2,650 now, so early maps are partly blank. These are price changes as they happened, not adjusted for inflation, so a rise smaller than general price growth is a real-terms decline. Connecticut is shown by its nine planning regions. Unlike the Census home value map, this follows price changes of the same homes over time, not the value owners estimate."
terms: [fhfa-hpi]
measure: { kind: fhfa_hpi, year: 2025 }
timeline: { from: 1996, to: 2025 }
# Manual breaks centered on zero so the middle shade means "about flat" (the popest approach); 10% over ten years is under 1% a year.
symbology: { ramp: brbg, classification: manual, classes: 5, breaks: [-10, 10, 50, 100] }
