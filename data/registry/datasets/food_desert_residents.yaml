id: food_desert_residents
title: Residents of low-income, low-access tracts
phrase: shares of residents in food deserts
description: "Share of residents living in census tracts USDA flags as low income and low access: at least 500 people, or a third of residents, live more than 1 mile (urban) or 10 miles (rural) from the nearest supermarket. Often called food deserts."
category: Health
