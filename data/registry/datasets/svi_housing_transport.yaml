  citation: "Centers for Disease Control and Prevention/Agency for Toxic Substances and Disease Registry/Geospatial Research, Analysis, and Services Program. CDC/ATSDR Social Vulnerability Index 2022 Database U.S. (SVI_2022_US.csv, SVI_2022_US_county.csv), field RPL_THEME4. https://www.atsdr.cdc.gov/place-health/php/svi/svi-data-documentation-download.html Accessed on October 12, 2026."
license: "Public domain (U.S. Government work, 17 U.S.C. § 105). CDC asks users to cite the SVI with its suggested citation."
updateCadence: irregular
vintage: "2022 (from the 2018–2022 ACS)"
geographyLevels: [county, tract]
unit: percentile
universe: "counties or census tracts (national rank among the same level)"
