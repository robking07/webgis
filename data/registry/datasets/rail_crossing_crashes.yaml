id: rail_crossing_crashes
title: Rail crossing crashes
phrase: rail crossing crashes a year
description: "How many crashes happen in a year where a public road crosses railroad tracks at street level: a train hitting a vehicle, a person on foot or someone on a bike at the crossing. The map opens on the average for 2021–2025; step back through single years to 1975. Counted where the crash happened."
category: Transportation
subcategory: Traffic safety
tags: [railroad, grade crossings, train crashes, rail safety, FRA, Form 57, Vision Zero]
source:
