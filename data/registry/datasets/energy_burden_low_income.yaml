  kind: lead
  url: "https://data.openei.org/files/6219/{ST}-2022-LEAD-data.zip"
  year: 2022
  grouping: FPL
  bands: ["0-100%", "100-150%", "150-200%"]
  stat: burden
  minHouseholds: 20
symbology:
  ramp: oranges
  classification: manual
  classes: 5
  breaks: [6, 8, 10, 15]
  higherIsBetter: false
