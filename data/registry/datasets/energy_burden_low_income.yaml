id: energy_burden_low_income
title: Home energy burden, lower-income households
phrase: home energy burdens for lower-income households
description: "Share of income spent on home energy by households with incomes at or below twice the federal poverty line (about $55,500 for a family of four in 2022): their average yearly energy bill divided by their average income."
category: Environmental justice
tags: [energy burden, energy affordability, low-income, utility bills, heating, LEAD, Justice40, environmental justice, poverty, federal poverty level]
source:
  name: U.S. Department of Energy, Low-Income Energy Affordability Data (LEAD) Tool, 2022 Update (with NREL; via OEDI)
  shortName: DOE LEAD Tool
  url: https://data.openei.org/submissions/6219
  citation: "Ma, Ookie and Aaron Vimont. Low-Income Energy Affordability Data - LEAD Tool - 2022 Update. U.S. Department of Energy, Office of Energy Efficiency and Renewable Energy, August 1, 2024. Distributed by Open Energy Data Initiative (OEDI). https://doi.org/10.25984/2504170"
license: "Creative Commons Attribution 4.0 (CC BY 4.0), per the OEDI submission page (\"license\": \"https://creativecommons.org/licenses/by/4.0/\"). Attribution: the citation above."
updateCadence: irregular
vintage: "2018–2022 average"
geographyLevels: [state, county, tract]
unit: percent
universe: households at or below 200% of the federal poverty level
coverageNote: "Modelled, not metered: DOE estimates each area's bills from 2018–2022 American Community Survey answers, scaled to match what utilities reported to EIA for 2022. \"Lower-income\" means income at or below 200% of the federal poverty guideline for the household's size, the same everywhere in the lower 48 (Alaska and Hawaii have higher guidelines). Bills paid inside the rent are left out of the average. The map's color edges at 6% and 10% are the common benchmarks for a \"high\" and a \"severe\" energy burden. Tracts with fewer than 20 lower-income households have no value."
terms: [energy-burden, federal-poverty-level, quantile-classes]
modelInputs: [median_household_income]  # burden divides by the same ACS household income
