id: pct_zero_vehicle_households
title: Households with no vehicle
description: Share of households with no vehicle available.
category: Vehicles
tags: [car-free, vehicles, mobility, transportation]
source:
  name: U.S. Census Bureau, American Community Survey 5-Year Estimates
  url: https://www.census.gov/programs-surveys/acs
  citation: "U.S. Census Bureau, 2020–2024 American Community Survey 5-Year Estimates"
license: Public domain (U.S. Government work, 17 U.S.C. § 105)
updateCadence: annual
vintage: "2020–2024 (5-year estimate)"
geographyLevels: [state, county, tract, block_group]
defaultLevel: tract  # ACS: tracts keep margins of error low (Robbie, D-33)
unit: percent
universe: households
terms: [acs-5-year, margin-of-error, census-geography, quantile-classes]
learnMore:
  - label: See this place's full Census profile on Census Reporter
    url: "https://censusreporter.org/profiles/{cr}/"
measure:
  kind: acs5
  numerator: [B08201_002]
  denominator: [B08201_001]
  scale: 100
  # B08201 stops at tracts; B25044 (tenure by vehicles) gives owners + renters with none at block groups.
  blockGroup: { numerator: [B25044_003, B25044_010], denominator: [B25044_001] }
symbology: { ramp: oranges, classification: quantile, classes: 5 }
