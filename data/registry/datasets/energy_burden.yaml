coverageNote: "Modelled, not metered: DOE estimates each area's bills from 2018–2022 American Community Survey answers, scaled to match what utilities reported to EIA for 2022. Bills paid inside the rent are left out of the average. Small or rural areas served by small utilities are the least reliable, and differences between LEAD editions are within its error, so don't read changes over time. Tracts with fewer than 20 households have no value."
