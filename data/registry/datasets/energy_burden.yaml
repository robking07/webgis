id: energy_burden
title: Home energy burden
phrase: home energy burdens
description: "Share of household income spent on home energy (electricity, gas and other heating fuels): the average yearly energy bill divided by the average household income, for all households."
category: Environmental justice
tags: [energy burden, energy affordability, utility bills, electricity, heating, LEAD, Justice40, environmental justice]
