coverageNote: "Years before 2010 leave out federal government jobs (the Census Bureau began counting them in 2010), so places with many federal workers jump between 2009 and 2010. The Census Bureau has no complete job counts for some states in some years, so those states show as no data (not zero jobs): Washington, D.C. before 2010; Massachusetts before 2011; Arizona and Mississippi before 2004; Arkansas and New Hampshire in 2002; Alaska after 2016; Michigan in 2022 (the 2023 map shows its 2021 jobs, the latest it has published). The U.S. figure for a year counts only the states with data. Puerto Rico isn't covered. The map colors use the same breaks for every year."
