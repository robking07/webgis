license: Public domain (U.S. Government work; data.cdc.gov license field "Public Domain")
updateCadence: annual
geographyLevels: [county]
unit: percent
universe: adults 18+ (model-based estimate)
modelInputs: [pct_poverty, median_household_income]  # PLACES models county poverty; median income is near-collinear with it
coverageNote: "Only states that asked CDC's optional social-needs questions in their 2023 survey have data on utility shut-off threats. No data for Colorado, Florida, Kentucky, Oregon, Pennsylvania, South Dakota, Tennessee, Texas, Vermont, Washington or Wyoming."
vintage: "2023 data"
terms: [model-based-estimate, age-adjusted, margin-of-error, quantile-classes]
