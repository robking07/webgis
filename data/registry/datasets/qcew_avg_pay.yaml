id: qcew_avg_pay
title: Average pay per job
phrase: average pay per job
description: Average yearly pay of the jobs located in the area, all industries, private and government, in 2024 dollars. It is total wages divided by the number of jobs, so it counts where people work, not where they live.
category: Economy
subcategory: Jobs
tags: [wages, pay, earnings, salary, jobs, employment, workplace, QCEW, BLS]
source:
