  shortName: BLS
  url: https://www.bls.gov/cew/
  citation: "U.S. Bureau of Labor Statistics, Quarterly Census of Employment and Wages, annual averages (1990–2025); restated in 2024 dollars with the BLS CPI-U"
license: Public domain (U.S. Government work, 17 U.S.C. § 105)
updateCadence: annual
vintage: "2025 (in 2024 dollars)"
geographyLevels: [state, county]
unit: dollars
universe: jobs covered by unemployment insurance (by workplace)
coverageNote: "Counted where people work, not where they live: a county's figure is the pay of the jobs located there, whoever holds them. It covers jobs under unemployment insurance, more than 95% of U.S. jobs, and leaves out the self-employed, most farm and household workers, railroad workers and members of the military. Pay includes bonuses and stock options, and part-time and seasonal jobs count as whole jobs, so this is not what a typical worker earns. BLS withholds a few county figures to protect individual employers; those show no data, not zero. Every year is in 2024 dollars, adjusted for inflation with the consumer price index (CPI-U), so the 2025 figures read about 2.6% below BLS's own. The Job density map counts jobs from Census LODES, which starts from the same employer records but counts jobs at one point in the year and adds statistical noise; this map uses BLS's yearly averages, for states and counties only. Connecticut shows its old counties through 2023 and its nine planning regions from 2024."
