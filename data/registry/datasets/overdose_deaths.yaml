geographyLevels: [county]
unit: per_100k
universe: deaths per resident (rate uses ACS population), by the decedent's county of residence
modelInputs: [population_density]
coverageNote: "About half of counties (1,630 of 3,144) have no value: CDC hides counts of 1–9 deaths, so a blank county is not a zero and is not necessarily low, just under 10 deaths. Shown rates come from counties with 10 or more deaths, which skews toward larger places. Provisional counts run low where cause-of-death investigations are still pending. Connecticut uses pre-2022 county codes and shows no data."
