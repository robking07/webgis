id: permits_per_1k
title: New homes permitted per 1,000 residents
phrase: rates of new home permits
description: Housing units authorized by building permits during the year, per 1,000 residents. Darker areas approved more new homes for their size. A permit is approval to build, not a finished home.
category: Housing
subcategory: Homes
tags: [building permits, new construction, housing supply, homebuilding, growth]
