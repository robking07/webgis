id: popest_natural_change
title: Births minus deaths
phrase: rates of births outnumbering deaths
description: Births minus deaths in the year to July 1, per 1,000 residents. Teal areas had more births than deaths; brown areas had more deaths, which is common where residents are older.
category: People
subcategory: Population and age
