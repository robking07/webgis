id: nri_wildfire_loss
title: "Expected yearly wildfire losses, per resident"
phrase: "expected wildfire losses per resident"
description: "FEMA's estimate of what wildfire cost here in an average year (damage to buildings and crops, plus deaths and injuries valued in dollars), divided by the number of residents."
