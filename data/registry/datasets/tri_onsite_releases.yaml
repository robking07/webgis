title: Toxic chemical releases (pounds per square mile)
phrase: toxic chemical releases per square mile
description: "Pounds of toxic chemicals that industrial facilities reported releasing at their own sites each year (into the air, water, underground or onto land), per square mile of land. Step back through time to see each reporting year since 1987. Pounds released are not the same as people's exposure or health risk."
