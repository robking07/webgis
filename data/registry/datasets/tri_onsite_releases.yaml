universe: pounds of TRI chemicals released on site by reporting facilities, per square mile of land (not people or exposure)
coverageNote: "Only larger facilities in covered industries report (generally 10 or more employees and above set chemical amounts), so a county shown at zero has no reporting facility, not no pollution. Amounts are the facilities' own estimates. Metal mines account for nearly half of all pounds, mostly waste rock placed on land at the mine. Pounds say nothing about how toxic a chemical is or whether anyone is exposed to it. Connecticut counties show no data (facility records use its pre-2022 counties). Read changes over time with care: the list of reportable chemicals and industries grew, so a jump is often a rule change, not more pollution. About 286 chemicals were added for 1995; metal mines, coal mines, power plants and some other industries began reporting in 1998 (metal mines are now nearly half of all pounds); and in 2000 and 2001 the reporting thresholds for lead and other persistent, bioaccumulative chemicals dropped sharply, bringing in many small releasers. PFAS were added from 2020. Each year is placed in today's counties by the facility's current county. 1987, the first year, reads far higher than later years in many counties: about 10.6 of its 17.5 billion pounds were sodium sulfate solution, which EPA dropped from the list after 1987, including 5.2 billion pounds from one facility."
