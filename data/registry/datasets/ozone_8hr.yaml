id: ozone_8hr
title: Ground-level ozone (smog)
phrase: smog (ozone) levels
description: "Ground-level ozone, 2023–2025 design value: the fourth-highest daily peak (8-hour average) each year, averaged over three years, at each county's highest valid monitor. The federal standard is 0.070 parts per million."
category: Environment
tags: [air quality, pollution, ozone, smog, health]
source:
  name: U.S. EPA, Office of Air Quality Planning and Standards, Ozone Design Values (2015 8-hour NAAQS)
  shortName: EPA
  url: https://www.epa.gov/air-trends/air-quality-design-values
  citation: "U.S. Environmental Protection Agency, Air Quality Design Values: ozone design values 2023–2025 (final, updated June 8, 2026), Table 4 County Status"
license: Public domain (U.S. Government work, 17 U.S.C. § 105; EPA permits free non-commercial and educational use)
updateCadence: annual
vintage: "2023–2025 design value"
geographyLevels: [county]
unit: ppm
universe: air at each county's highest-reading valid monitor (not people or area)
coverageNote: "Only the 688 counties with a valid ozone monitor have a value; every other county is blank, which means no monitor, not clean air. A county's value is its single highest monitor. EPA excludes exceptional-event days such as wildfire smoke. The federal 8-hour standard is 0.070 ppm; the top map classes mark counties above it (values are reported to three decimals, so 0.071 or higher exceeds it). EPA's tables are informational, not a regulatory determination."
terms: [design-value, naaqs]
measure:
