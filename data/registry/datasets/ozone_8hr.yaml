id: ozone_8hr
title: Ground-level ozone (smog)
phrase: smog (ozone) levels
description: "Ground-level ozone design value: the fourth-highest daily peak (8-hour average) each year, averaged over three years, at each county's highest valid monitor. Step back through time to see each three-year period since 2003–2005. The current federal standard is 0.070 parts per million."
category: Environment and climate
subcategory: Air quality
tags: [air quality, pollution, ozone, smog, health]
source:
  name: U.S. EPA, Office of Air Quality Planning and Standards, Ozone Design Values (2015 8-hour NAAQS)
  shortName: EPA
  url: https://www.epa.gov/air-trends/air-quality-design-values
  citation: "U.S. Environmental Protection Agency, Air Quality Design Values: ozone design values 2023–2025 (final, updated June 8, 2026), Table 4 County Status"
license: Public domain (U.S. Government work, 17 U.S.C. § 105; EPA permits free non-commercial and educational use)
updateCadence: annual
vintage: "2023–2025 design value"
geographyLevels: [county]
unit: ppm
universe: air at each county's highest-reading valid monitor (not people or area)
coverageNote: "Only counties with a valid ozone monitor have a value (about 640 to 730, depending on the period); every other county is blank, which means no monitor, not clean air. A county's value is its single highest monitor. EPA excludes exceptional-event days such as wildfire smoke. The federal 8-hour standard was 0.084 ppm until 2008, 0.075 until 2015 and is now 0.070 (the top map classes mark counties above it today; values are reported to three decimals, so 0.071 or higher exceeds it), so a county can pass an older standard and fail today's. Each period is a three-year average labeled by its last year; earlier ones are EPA's published figures (2003–2005 to 2006–2008 come from EPA's monitor listings, taking each county's highest valid monitor). EPA publishes no county-level ozone design values before 2003–2005. EPA's tables are informational, not a regulatory determination."
terms: [design-value, naaqs]
