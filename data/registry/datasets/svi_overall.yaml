id: svi_overall
title: "Social vulnerability, overall (CDC index)"
phrase: "social vulnerability ranks"
description: "How hard a disaster or disease outbreak would hit residents, from CDC's Social Vulnerability Index: 16 census measures of income, age, disability, language, race and ethnicity, housing and transportation, ranked nationally."
tags: [CDC, ATSDR, SVI, social vulnerability index, emergency planning, disasters, public health, vulnerability]
category: Environmental justice
source:
  name: CDC/ATSDR Social Vulnerability Index 2022
  shortName: CDC SVI
  url: https://www.atsdr.cdc.gov/place-health/php/svi/index.html
  citation: "Centers for Disease Control and Prevention/Agency for Toxic Substances and Disease Registry/Geospatial Research, Analysis, and Services Program. CDC/ATSDR Social Vulnerability Index 2022 Database U.S. (SVI_2022_US.csv, SVI_2022_US_county.csv), field RPL_THEMES. https://www.atsdr.cdc.gov/place-health/php/svi/svi-data-documentation-download.html Accessed on October 12, 2026."
license: "Public domain (U.S. Government work, 17 U.S.C. § 105). CDC asks users to cite the SVI with its suggested citation."
updateCadence: irregular
vintage: "2022 (from the 2018–2022 ACS)"
geographyLevels: [county, tract]
unit: percentile
universe: "counties or census tracts (national rank among the same level)"
modelInputs: [svi_socioeconomic, svi_household, svi_minority, svi_housing_transport]
coverageNote: "A rank from 0 to 100 among all U.S. counties, or among all U.S. tracts (not within each state): the 90th percentile means more vulnerable than 90% of counties (or tracts). Tracts with no residents, and some where CDC couldn't estimate an input, show no data. Puerto Rico isn't included in CDC's U.S. files. Not comparable with earlier SVI years."
terms: [cdc-svi, percentile-rank, acs-5-year]
