coverageNote: "States and counties only; Puerto Rico is not included. These are estimates built from births, deaths and administrative records, not a count, and each year's release revises the years before it, so figures here can differ from earlier editions. The year control starts at 2021 because the base is the 2020 Census. Connecticut is shown by its nine planning regions."
