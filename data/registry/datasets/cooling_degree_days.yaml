id: cooling_degree_days
title: Cooling degree days
phrase: cooling needs
description: "How much air conditioning homes and buildings need in a year: the sum, over every day, of how many degrees the day's average temperature rose above 65°F. Average over 1991–2020."
category: Environment and climate
subcategory: Climate
tags: [cooling, air conditioning, heat, energy, climate]
source:
  name: NOAA NCEI nClimDiv county climate data
  shortName: NOAA
  url: https://www.ncei.noaa.gov/pub/data/cirs/climdiv/
  citation: "NOAA National Centers for Environmental Information, nClimDiv county monthly data (Vose et al. 2014), 1991–2020 normals computed by this site"
license: Public domain (U.S. Government work, 17 U.S.C. § 105)
updateCadence: static
vintage: "1991–2020 average"
geographyLevels: [county]
universe: county area (area-weighted grid average)
coverageNote: Contiguous U.S. and Alaska; Hawaii has no county series. Connecticut uses pre-2022 county codes in nClimDiv, so it shows no data. Years before 1991 reach back to 1895 as 10-year averages (the first covers 1895–1900); early decades are estimated from far fewer weather stations (NOAA nClimGrid method, 2014), so treat early county differences with caution.
unit: degree_days
terms: [degree-days, climate-normal, quantile-classes]
