coverageNote: "A relative rank (0–100) among counties, or among tracts, not an absolute amount of risk. Puerto Rico and the island territories show no data (FEMA rates them Insufficient Data). Version 1.20 switched its social vulnerability source, so scores moved even where hazards didn't. Not comparable with NRI version 1.19 (March 2023)."
