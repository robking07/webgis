coverageNote: "Only counties with a valid PM2.5 monitor have a value (about 330 in 1999–2001, about 540 in recent periods); every other county is blank, which means no monitor, not clean air. A county's value is its single highest monitor, so one near-road or border monitor can set it. EPA excludes wildfire-smoke days it concurs are exceptional events, so smoke-heavy years read lower than residents experienced. The map classes stay the same for every period. The federal annual standard was 15.0 µg/m³ until 2013, 12.0 until 2024 and is now 9.0 (the top map class marks counties above it today), so a county can pass an older standard and fail today's. Each period is a three-year average labeled by its last year; earlier ones are EPA's published figures (periods before 2005–2007 come from monitor listings in EPA's 2005–2007 report, taking each county's highest valid monitor, and 1999–2001 is the first period with a full federal monitoring network). Monitors were sparser early on, so a county's first appearance can reflect a new monitor, not a change in air. EPA's tables are informational, not a regulatory determination. El Paso County, Texas, in 2023–2025: its value comes from a monitor that began in May 2024, so it covers two years, not three, and it includes the 2025 spring dust storms; Texas has not asked EPA to exclude those days."
