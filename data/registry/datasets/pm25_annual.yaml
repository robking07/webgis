title: Fine particle pollution (PM2.5)
phrase: fine particle pollution levels
description: "Yearly average concentration of fine particles (PM2.5) in the air, averaged over three years, at each county's highest valid monitor. Step back through time to see each three-year period since 1999–2001. The current federal standard is 9.0 micrograms per cubic meter."
