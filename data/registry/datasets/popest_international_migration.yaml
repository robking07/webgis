unit: per_1k
universe: total population (modeled estimate)
coverageNote: "Modeled, not counted: the Census Bureau estimates international moves from survey and administrative sources and spreads them across counties, so small counties' figures are rough and can be revised. Each release revises its decade, and 2011–2019 come from the Vintage 2020 estimates (built on the 2010 Census) while 2021 on build on the 2020 Census, so the two runs are not one series; 2020 is left out. Connecticut shows its old counties through 2019 and its nine planning regions from 2021."
