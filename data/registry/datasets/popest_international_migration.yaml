id: popest_international_migration
title: People moving in from abroad
phrase: rates of people moving in from abroad
description: People who moved in from other countries minus people who moved out, in the year to July 1, per 1,000 residents. Darker areas gained more residents from abroad.
category: People
subcategory: Immigration and language
tags: [migration, immigration, population estimates, international migration, demographics]
