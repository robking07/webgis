coverageNote: "States and counties only. Kalawao County, Hawaii, has no estimate, and Puerto Rico is not covered. Years go back to 2008, when the estimates began using the American Community Survey; the Census Bureau advises against comparing them with its earlier estimates. Rates fell sharply in 2014, when the Affordable Care Act's marketplaces and Medicaid expansions began."
