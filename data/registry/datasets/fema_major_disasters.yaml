id: fema_major_disasters
title: "Major disaster declarations"
phrase: "counts of major disaster declarations"
description: "How many times the President declared a major disaster that covered this area, from FEMA's list of every federal declaration: since 2000, or one decade at a time back to the 1960s. Each disaster counts once, however many times the area was named in it. A declaration is an administrative decision, not a measure of damage."
