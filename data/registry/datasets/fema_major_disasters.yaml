coverageNote: "Counts declarations, not damage: a declaration depends on the governor asking for one and on federal cost thresholds, and requests that were turned down aren't listed. Thresholds and the habit of asking have changed over the decades, so older decades show fewer declarations; FEMA typed its older records in after 1998, and county detail starts in 1964 (declarations from 1960 to 1963 count toward the state only). The 2020s are the decade so far. Pandemic declarations (COVID-19, 2020) are left out: they covered every county. Declarations that name a whole state or a tribal area count toward the state only; declarations requested by tribal governments aren't counted. Connecticut counties show no data (FEMA still lists its old counties)."
