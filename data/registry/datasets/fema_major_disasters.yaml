id: fema_major_disasters
title: "Major disaster declarations since 2000"
phrase: "counts of major disaster declarations"
description: "How many times since 2000 the President declared a major disaster that covered this area, from FEMA's list of every federal declaration. Each disaster counts once, however many times the area was named in it."
