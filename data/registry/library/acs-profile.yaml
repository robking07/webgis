# The Library recipe (pilot #372, second batch #373; docs/library.md): ACS 5-year shares, chosen for planners.
# `npm run ingest -- library` turns each map below into data/registry/datasets/<id>.yaml with
# `library: true`, after the automatic checks (data/ingest/src/library.ts). A map that fails a check
# is left out (its file is removed) and the reason is kept in acs-profile.checks.json.
#
# Fields: id, title (plain words, no codes), topic (category/subcategory), universe (who the share is
# of), num (cells summed), den (only for detailed tables; Data Profile percents are already shares),
# text (the one-sentence description), tags (search words).
# Left out of the pilot until Robbie reviews the wording: race and ethnicity, ancestry, citizenship and
# foreign birth, language, disability, health insurance, poverty.
vintage: "2020–2024 (5-year estimate)"
year: 2024
ramps: { Housing: blues, People: purples, Economy: ylgnbu, Transportation: blues }
# Table names for the citation (data.census.gov titles).
