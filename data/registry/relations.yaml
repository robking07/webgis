# How maps relate to each other (#156; schema and checks: relations.ts). `npm run registry:validate`
# fails if a registry map is missing here, so every new dataset gets an entry:
#   maps:   every map, with its topic group (= its registry `category`) and, when the ingest
#           publishes the counts behind it (relations.ts `countsSpec`), plain names for them:
#           `of` = the numerator, `per` = the denominator.
#   parts:  maps whose shares of one total add up to 100%, plus a remainder for what's left.
#   links:  hand-picked pairs of related maps, each with a short reason a reader would accept.

parts:
  race_ethnicity:
    label: Race and ethnicity
    explainer: Every resident is counted once, in one of these groups. "People of color" is everyone except non-Hispanic White residents, so it overlaps these and isn't one of them.
    members: [pct_white_nh, pct_hispanic_latino, pct_black_nh, pct_asian_nh, pct_multiracial_nh, pct_aian_nh, pct_nhpi_nh]
    remainder:
      id: some_other_race_nh
      label: Some other race (non-Hispanic)
      variables: [B03002_008]
  commute_modes:
    label: How people get to work
    explainer: Every worker 16 and older is counted once, by the way they usually got to work in the week before the survey.
    members: [pct_drive_alone, pct_carpool, pct_work_from_home, pct_transit_commute, pct_walk_commute, pct_bike_commute]
    remainder:
      id: other_commute_mode
      label: Taxi, motorcycle or another way
      variables: [B08301_016, B08301_017, B08301_020]

links:
  # Housing costs and income
  - { maps: [median_gross_rent, median_household_income], why: Rent is paid out of household income. }
  - { maps: [pct_rent_burdened, median_gross_rent], why: Higher rents push more renters past 30% of income. }
  - { maps: [pct_rent_burdened, pct_renter_households], why: Rent burden is a share of renter households only. }
  - { maps: [pct_rent_burdened, median_household_income], why: Rent burden compares rent with income. }
  - { maps: [median_home_value, median_household_income], why: How far home prices run ahead of incomes. }
  - { maps: [pct_owner_cost_burdened, median_owner_costs_mortgage], why: Higher monthly costs push more owners past 30% of income. }
  - { maps: [pct_overcrowded, median_gross_rent], why: Crowding often follows high rents. }
  # Poverty and help
  - { maps: [pct_poverty, median_household_income], why: Two views of the same income distribution. }
  - { maps: [pct_poverty, pct_child_poverty], why: Child poverty is poverty among children only. }
  - { maps: [pct_poverty, pct_snap_households], why: SNAP eligibility is set by income relative to the poverty line. }
  - { maps: [pct_poverty, pct_public_assistance], why: Cash assistance goes to households with very low incomes. }
  - { maps: [pct_poverty, food_insecurity], why: Not being able to afford enough food tracks low income. }
  - { maps: [pct_poverty, pct_uninsured], why: People with low incomes are less often insured. }
  - { maps: [pct_poverty, nri_social_vulnerability], why: Poverty is one of the inputs to FEMA's social vulnerability score. }
  - { maps: [pct_bachelors_plus, median_household_income], why: Education and earnings go together. }
  - { maps: [pct_no_hs_diploma, pct_poverty], why: Adults without a diploma earn less on average. }
  - { maps: [pct_single_parent_families, pct_child_poverty], why: Children of single parents are more often poor. }
  # Work
  - { maps: [unemployment_rate, labor_force_participation], why: Unemployment is counted only among people in the labor force. }
  - { maps: [job_density, population_density], why: Where jobs are compared with where people live. }
  - { maps: [pct_work_outside_county, mean_commute_minutes], why: Working in another county usually means a longer trip. }
  - { maps: [mean_commute_minutes, pct_long_commute], why: The average and the share of long trips. }
  - { maps: [pct_long_commute, pct_extreme_commute], why: 90-minute-plus commutes are part of hour-plus commutes. }
  - { maps: [pct_leave_before_7am, pct_long_commute], why: Long commutes start early. }
  # Getting around
  - { maps: [pct_zero_vehicle_households, pct_transit_commute], why: Households without a car rely on transit. }
  - { maps: [pct_zero_vehicle_households, lack_transportation], why: Two views of not having a way to get around. }
  - { maps: [traffic_fatalities, vmt_per_capita], why: More driving per person means more exposure to crashes. }
  - { maps: [aadt, vmt_per_capita], why: Road traffic counts are what driving totals are built from. }
  # Population
  - { maps: [population_density, census2020_pop_density], why: The same measure from the survey and from the 2020 count. }
  - { maps: [census2020_housing_density, census2020_pop_density], why: Homes and residents per square mile from the same count. }
  - { maps: [pct_age_65_plus, pct_seniors_living_alone], why: More older residents, more seniors living alone. }
  - { maps: [pct_seniors_living_alone, loneliness], why: Living alone is one driver of loneliness. }
  - { maps: [pct_foreign_born, pct_limited_english], why: Many households with limited English are immigrant households. }
  - { maps: [pct_foreign_born, ice_287g_agreements], why: Where immigrants live and where local police work with ICE. }
  - { maps: [pct_disability, disability_any], why: The same question from the Census survey and CDC's model. }
  # Internet
  - { maps: [pct_no_internet, pct_broadband], why: Two sides of home internet access. }
  - { maps: [pct_no_computer, pct_no_internet], why: Households without a computer often have no internet either. }
  # Energy and climate
  - { maps: [energy_burden, home_energy_cost], why: Energy burden is energy cost divided by income. }
  - { maps: [energy_burden, median_household_income], why: The same bill is a bigger share of a smaller income. }
  - { maps: [energy_burden, energy_burden_low_income], why: All households and lower-income households only. }
  - { maps: [home_energy_cost, heating_degree_days], why: Colder places spend more on heating. }
  - { maps: [home_energy_cost, cooling_degree_days], why: Hotter places spend more on cooling. }
  - { maps: [home_energy_cost, pct_homes_built_before_1960], why: Older homes are often harder to heat and cool. }
  - { maps: [nri_heat_wave_loss, july_high], why: Heat-wave losses are highest where summers are hottest. }
  - { maps: [nri_tornado_loss, pct_mobile_homes], why: Mobile homes are the most exposed to tornadoes. }
  - { maps: [nri_expected_loss_per_person, nri_risk_score], why: Expected loss is the main part of FEMA's risk score. }
  - { maps: [cejst_pct_pop_disadvantaged, cejst_disadvantaged_tracts], why: The share of residents and the tracts behind it. }
  # Health and environment
  - { maps: [pm25_annual, asthma], why: Fine-particle pollution worsens asthma. }
  - { maps: [ozone_8hr, asthma], why: Ozone worsens asthma. }
  - { maps: [pm25_annual, copd], why: Fine-particle pollution worsens lung disease. }
  - { maps: [overdose_deaths, mental_distress], why: Overdose and mental distress often go together. }
  - { maps: [pct_uninsured, routine_checkup], why: People without insurance see a doctor less often. }
  # Food access
  - { maps: [far_from_supermarket, food_access_tracts], why: The share of residents and the tracts behind it. }
  - { maps: [no_car_far_from_supermarket, food_access_no_car_tracts], why: The share of households and the tracts behind it. }
  - { maps: [food_desert_residents, far_from_supermarket], why: Low-income, low-access tracts are low-income tracts where many residents live far from a supermarket. }
  - { maps: [no_car_far_from_supermarket, pct_zero_vehicle_households], why: Living far from a supermarket is harder without a car. }
  - { maps: [food_desert_residents, food_insecurity], why: Living far from a supermarket on a low income can make it harder to get enough food. }

